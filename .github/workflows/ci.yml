name: CI

on:
  push:
    branches:
      - main
      - 'beta/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: pwsh
        run: Install-Module -Name InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-Build Deps, Lint

  test:
    name: Pester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: pwsh
        run: Install-Module -Name InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Build Deps, Test

  test-windows-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: powershell
        run: |
          # Without TLS 1.2 the PowerShellGet calls cannot reach the PSGallery on PS 5.1.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: powershell
        run: Invoke-Build Deps, Test
